name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - uses: Platane/snk@v3
        id: snake-svg
        with:
          github_user_name: rohiniwari
          outputs: dist/github-contribution-grid-snake.svg
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          fqdn: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
